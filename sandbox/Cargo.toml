[package]
default-run = "aimm-sandbox"
name = "aimm-sandbox"
version = "0.1.0"
edition = "2021"
publish = false
description = "Replays the real Polymarket histories as transactions on a local NEAR node and checks every number against the native run"

[dependencies]
anyhow = "1.0.104"
near-workspaces = "0.24.0"
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
